<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .room-header { background: #667eea; color: white; padding: 40px 0; margin-bottom: 30px; text-align: center; }
        .review-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .text-warning { color: #ffc107 !important; }
    </style>
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    
    <div class="room-header">
        <h1 class="fw-bold" th:text="${room.roomTypeName}">Tên Loại Phòng</h1>
        <p class="fs-5">Phòng số: <span th:text="${room.roomNumber}"></span></p>
    </div>
    
    <div class="container py-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                
                <div class="card mb-5 border-0 shadow-sm">
                    <div class="card-body">
                        <h4 class="fw-bold mb-3">Thông tin phòng</h4>
                        <p th:text="${room.description}"></p>
                        <p><strong>Giá phòng:</strong> <span class="text-danger fw-bold fs-5" th:text="${#numbers.formatDecimal(room.price, 0, 'COMMA', 0, 'POINT')} + ' đ / đêm'"></span></p>
                        
                        <a th:href="@{/customer/bookings/book(roomId=${room.id})}" class="btn btn-primary px-4 py-2 mt-3" style="background-color: #667eea; border-color: #667eea;">Đặt phòng ngay</a>
                    </div>
                </div>

                <h3 class="fw-bold mb-4"><i class="fas fa-comments me-2"></i>Đánh giá từ khách hàng</h3>
                
                <div th:if="${#lists.isEmpty(reviews)}" class="alert alert-info">
                    Chưa có đánh giá nào cho phòng này.
                </div>
                
                <div th:each="review : ${reviews}" class="review-card">
                    <div class="d-flex justify-content-between mb-2">
                        <h6 class="fw-bold mb-0" th:text="${review.customer.fullName}">Tên khách hàng</h6>
                        <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                    <div class="mb-2 text-warning">
                        <i class="fas fa-star" th:each="i : ${#numbers.sequence(1, review.rating)}"></i>
                        <i class="far fa-star" th:if="${review.rating < 5}" th:each="i : ${#numbers.sequence(1, 5 - review.rating)}"></i>
                    </div>
                    <p class="mb-0" th:text="${review.comment}">Nội dung đánh giá</p>
                </div>
                
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
