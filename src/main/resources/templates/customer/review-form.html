<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá phòng - HTDBooking.com</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background:#f5f5f5; font-family:BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
        .review-hero { background:linear-gradient(135deg,#004d40,#00251a); color:#fff; padding:32px 0; text-align:center; }
        .review-hero h3 { font-weight:800; margin-bottom:4px; }
        .review-hero p { opacity:.7; margin:0; font-size:14px; }
        .review-card { background:#fff; border:1px solid #e7e7e7; border-radius:8px; padding:32px; max-width:560px; margin:32px auto; }
        .review-card h5 { font-size:16px; font-weight:700; color:#1a1a2e; margin-bottom:4px; }
        .review-card .sub { font-size:13px; color:#6b6b6b; margin-bottom:20px; }
        .rating-stars { display:flex; flex-direction:row-reverse; justify-content:center; font-size:2.5rem; margin-bottom:24px; gap:4px; }
        .rating-stars input { display:none; }
        .rating-stars label { color:#d9d9d9; cursor:pointer; transition:color .15s; }
        .rating-stars input:checked ~ label { color:#f57c00; }
        .rating-stars label:hover, .rating-stars label:hover ~ label { color:#f57c00; }
        .form-label { font-weight:600; font-size:14px; color:#1a1a2e; }
        .form-control { border:1px solid #8f8f8f; border-radius:4px; }
        .form-control:focus { border-color:#00897b; box-shadow:0 0 0 3px rgba(0,108,228,.15); }
        .btn-submit { background:#00897b; color:#fff; border:none; font-weight:700; font-size:16px; padding:12px; border-radius:4px; width:100%; transition:background .2s; }
        .btn-submit:hover { background:#00695c; color:#fff; }
    </style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="review-hero">
    <h3>Đánh giá trải nghiệm của bạn</h3>
    <p>Chia sẻ trải nghiệm giúp các du khách khác lựa chọn tốt hơn</p>
</div>

<div class="container">
    <div th:if="${errorMessage}" class="alert alert-danger mt-3 text-center" style="max-width:560px; margin-left:auto; margin-right:auto;" th:text="${errorMessage}"></div>

    <div class="review-card">
        <div class="text-center mb-3">
            <h5>Mã đặt phòng: <span style="color:#00897b;" th:text="${booking.bookingCode}"></span></h5>
            <div class="sub">Phòng: <span th:text="${booking.bookingDetails[0].room.roomNumber}"></span> — <span th:text="${booking.bookingDetails[0].room.roomType.name}"></span></div>
        </div>
        
        <form th:action="@{/customer/reviews/create}" method="post">
            <input type="hidden" name="bookingId" th:value="${booking.id}">
            
            <div class="mb-4 text-center">
                <label class="form-label d-block mb-3">Bạn đánh giá chất lượng phòng thế nào?</label>
                <div class="rating-stars">
                    <input type="radio" id="star5" name="rating" value="5" required><label for="star5"><i class="bi bi-star-fill"></i></label>
                    <input type="radio" id="star4" name="rating" value="4"><label for="star4"><i class="bi bi-star-fill"></i></label>
                    <input type="radio" id="star3" name="rating" value="3"><label for="star3"><i class="bi bi-star-fill"></i></label>
                    <input type="radio" id="star2" name="rating" value="2"><label for="star2"><i class="bi bi-star-fill"></i></label>
                    <input type="radio" id="star1" name="rating" value="1"><label for="star1"><i class="bi bi-star-fill"></i></label>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="comment" class="form-label">Nhận xét của bạn</label>
                <textarea class="form-control" id="comment" name="comment" rows="4" placeholder="Chia sẻ trải nghiệm: tiện nghi, dịch vụ, nhân viên..." required></textarea>
            </div>
            
            <button type="submit" class="btn-submit"><i class="bi bi-send me-1"></i> Gửi đánh giá</button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
