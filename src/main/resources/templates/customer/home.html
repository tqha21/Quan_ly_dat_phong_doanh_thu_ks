<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Booking.com - Khách sạn Hà Nội</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f5; color: #262626;}
        
        .hero {
            background: linear-gradient(rgba(0, 59, 149, 0.5), rgba(0, 59, 149, 0.5)), url('https://images.unsplash.com/photo-1555921015-5532091f6026?q=80&w=2070&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            padding: 80px 0;
            color: white;
            position: relative;
        }
        .hero-title { font-size: 48px; font-weight: bold; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
        .hero-subtitle { font-size: 24px; font-weight: normal; margin-bottom: 40px; text-shadow: 0 1px 2px rgba(0,0,0,0.5);}

        /* Search Bar in Hero */
        .search-form-hero { background-color: #febb02; padding: 4px; border-radius: 8px; display: flex; gap: 4px; flex-wrap: wrap;}
        .search-input-hero { background: white; padding: 12px 15px; border-radius: 4px; display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; position: relative;}
        .search-input-hero input { border: none; outline: none; width: 100%; font-weight: 500; font-size: 16px;}
        .search-input-hero i { color: #262626; font-size: 20px; }
        .search-input-hero label { position: absolute; top: 4px; left: 45px; font-size: 10px; color: #6b6b6b; font-weight: bold;}
        .search-input-hero input.with-label { padding-top: 14px; }
        
        .btn-search-hero { background-color: #0071c2; color: white; border: none; border-radius: 4px; padding: 0 40px; font-weight: bold; font-size: 20px; flex: 0 0 auto;}
        .btn-search-hero:hover { background-color: #005999; color: white;}

    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="hero">
    <div class="container">
        <h1 class="hero-title">Tìm khách sạn ở Hà Nội</h1>
        <p class="hero-subtitle">Nhập ngày bạn muốn để xem giá và ưu đãi mới nhất cho các khách sạn ở Hà Nội</p>
        
        <div th:if="${errorMessage}" class="alert alert-danger shadow-sm rounded-3 fw-bold text-center" th:text="${errorMessage}"></div>
        
        <form th:action="@{/rooms}" method="get" th:object="${searchRequest}" class="search-form-hero shadow">
            <div class="search-input-hero">
                <i class="bi bi-geo-alt"></i>
                <label>Nhập điểm đến</label>
                <input type="text" class="with-label" placeholder="Hà Nội" value="Hà Nội" readonly>
            </div>
            <div class="search-input-hero" style="flex: 1.5;">
                <i class="bi bi-calendar"></i>
                <label>Chọn ngày</label>
                <div class="d-flex w-100 align-items-center with-label">
                    <input type="date" th:field="*{checkIn}" required>
                    <span class="mx-2">—</span>
                    <input type="date" th:field="*{checkOut}" required>
                </div>
            </div>
            <div class="search-input-hero">
                <i class="bi bi-person"></i>
                <label>Chọn số lượng</label>
                <input type="text" class="with-label" placeholder="2 người lớn · 0 trẻ em · 1 phòng" value="2 người lớn · 0 trẻ em · 1 phòng" readonly>
                <i class="bi bi-chevron-down" style="font-size: 14px; margin-left: auto;"></i>
            </div>
            <button type="submit" class="btn-search-hero">Tìm</button>
        </form>
    </div>
</div>

<div class="container mt-5 mb-5 pb-5">
    <h3 class="fw-bold mb-4">Các điểm đến thịnh hành</h3>
    <div class="row g-3">
        <div class="col-md-6">
            <div style="height: 250px; background: url('https://images.unsplash.com/photo-1583417319070-4a69db38a482?w=800') center/cover; border-radius: 8px; position: relative; color: white; display: flex; align-items: flex-start; padding: 20px; font-weight: bold; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">
                Thành phố Hồ Chí Minh
            </div>
        </div>
        <div class="col-md-6">
            <div style="height: 250px; background: url('https://images.unsplash.com/photo-1555921015-5532091f6026?w=800') center/cover; border-radius: 8px; position: relative; color: white; display: flex; align-items: flex-start; padding: 20px; font-weight: bold; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">
                Hà Nội
            </div>
        </div>
    </div>
</div>

<div style="background-color: #003b95; color: white; padding: 20px 0; margin-top: auto; text-align: center; font-size: 14px;">
    Bản quyền © 2026 Luxury Hotel. Đã đăng ký bản quyền.
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
