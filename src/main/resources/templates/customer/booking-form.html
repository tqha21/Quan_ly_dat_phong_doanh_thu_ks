<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận Đặt Phòng - Luxury Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h3 class="fw-bold mb-4" style="color: #667eea;">THÔNG TIN ĐẶT PHÒNG</h3>
            
            <div th:if="${errorMessage}" class="alert alert-danger shadow-sm" th:text="${errorMessage}"></div>

            <div class="card shadow-sm border-0 mb-4 rounded-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold border-bottom pb-2 mb-3 text-dark"><i class="bi bi-info-square text-primary me-2"></i> Chi tiết phòng đã chọn</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <p class="mb-2"><strong>Số phòng:</strong> <span class="badge bg-primary fs-6" th:text="${room.roomNumber}"></span></p>
                            <p class="mb-2"><strong>Hạng phòng:</strong> <span th:text="${room.roomTypeName}"></span></p>
                            <p class="mb-2"><strong>Sức chứa tối đa:</strong> <span th:text="${room.capacity}"></span> người</p>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-2"><strong>Ngày Check-in:</strong> <span class="fw-bold text-success" th:text="${bookingRequest.checkInDate}"></span></p>
                            <p class="mb-2"><strong>Ngày Check-out:</strong> <span class="fw-bold text-danger" th:text="${bookingRequest.checkOutDate}"></span></p>
                            <p class="mb-2"><strong>Đơn giá:</strong> <span class="text-danger fw-bold" th:text="${#numbers.formatDecimal(room.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ / đêm'"></span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold border-bottom pb-2 mb-3 text-dark"><i class="bi bi-person-check text-primary me-2"></i> Xác nhận thông tin</h5>
                    <form th:action="@{/customer/bookings/create}" method="post" th:object="${bookingRequest}">
                        <input type="hidden" th:field="*{roomId}">
                        <input type="hidden" th:field="*{checkInDate}">
                        <input type="hidden" th:field="*{checkOutDate}">

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted">Người đặt phòng (Tài khoản hiện tại)</label>
                            <input type="text" class="form-control bg-light" th:value="${#authentication.principal.fullName}" readonly>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted">Ghi chú thêm (Yêu cầu đặc biệt nếu có)</label>
                            <textarea class="form-control" th:field="*{note}" rows="3" placeholder="Ví dụ: Đón tại sân bay lúc 15:00, cần thêm gối..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/rooms(checkIn=*{checkInDate}, checkOut=*{checkOutDate})}" class="btn btn-outline-secondary px-4 fw-bold shadow-sm">
                                <i class="bi bi-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold px-5 shadow-sm" style="background-color: #667eea; border: none; height: 45px;">
                                <i class="bi bi-check2-circle me-1"></i> XÁC NHẬN ĐẶT PHÒNG
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
