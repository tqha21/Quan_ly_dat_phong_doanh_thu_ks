<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="sidebar" class="stayora-sidebar">
    <!-- Brand -->
    <div class="sidebar-brand">
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">🏨</div>
            <div>
                <div class="sidebar-logo-name">HTD Hotel</div>
                <div class="sidebar-logo-sub">Quản lý Doanh thu</div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
        <a href="/admin/dashboard" class="sidebar-link" id="sl-dashboard">
            <svg class="sl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Tổng quan</span>
        </a>
        <a href="/admin/rooms" class="sidebar-link" id="sl-rooms">
            <svg class="sl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Quản lý Khách sạn</span>
        </a>
        <a href="/admin/bookings" class="sidebar-link" id="sl-bookings">
            <svg class="sl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span>Quản lý Đặt phòng</span>
        </a>
        <a href="/admin/customers" class="sidebar-link" id="sl-customers">
            <svg class="sl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Quản lý Khách hàng</span>
        </a>
        <a href="/admin/payments" class="sidebar-link" id="sl-payments">
            <svg class="sl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            <span>Quản lý Thanh toán</span>
        </a>
        <a href="/admin/promotions" class="sidebar-link" id="sl-promotions">
            <svg class="sl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            <span>Quản lý Khuyến mãi</span>
        </a>
        <a href="/admin/reviews" class="sidebar-link" id="sl-reviews">
            <svg class="sl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Quản lý Đánh giá</span>
        </a>
        <a href="/admin/revenue" class="sidebar-link" id="sl-revenue">
            <svg class="sl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span>Doanh thu & Báo cáo</span>
        </a>

        <div class="sidebar-divider"></div>

        <a href="/admin/users" class="sidebar-link" id="sl-users">
            <svg class="sl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
            <span>Người dùng</span>
        </a>
        <a href="/admin/settings" class="sidebar-link" id="sl-settings">
            <svg class="sl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Cài đặt</span>
        </a>

        <div class="sidebar-divider"></div>

        <a href="/" class="sidebar-link sidebar-link-home" id="sl-homepage" target="_blank">
            <svg class="sl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Về trang chủ</span>
            <svg style="width:12px;height:12px;margin-left:auto;opacity:0.5;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
    </nav>

    <!-- User Profile at bottom -->
    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-user-avatar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
            </div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" sec:authentication="principal.fullName">Admin</div>
                <div class="sidebar-user-role">Quản trị viên</div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" style="margin-top:12px;">
            <button type="submit" class="sidebar-logout-btn" id="sidebar-logout">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Đăng xuất
            </button>
        </form>
    </div>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        .stayora-sidebar {
            width: 240px;
            min-height: 100vh;
            background: #0f1f3d;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-brand {
            padding: 24px 20px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; }
        .sidebar-logo-icon { font-size: 28px; }
        .sidebar-logo-name { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
        .sidebar-logo-sub { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; text-transform: uppercase; letter-spacing: 0.5px; }
        .sidebar-nav { flex: 1; padding: 16px 12px; }
        .sidebar-link {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 8px;
            text-decoration: none; color: rgba(255,255,255,0.6);
            font-size: 13.5px; font-weight: 500;
            margin-bottom: 2px;
            transition: all 0.2s;
        }
        .sidebar-link:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .sidebar-link.active { background: #2563eb; color: #fff; font-weight: 600; }
        .sl-icon { width: 17px; height: 17px; flex-shrink: 0; }
        .sidebar-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 12px 0; }
        .sidebar-footer { padding: 16px 12px 20px; border-top: 1px solid rgba(255,255,255,0.08); }
        .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 8px 4px; }
        .sidebar-user-avatar {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; flex-shrink: 0;
        }
        .sidebar-user-name { font-size: 13px; font-weight: 700; color: #fff; }
        .sidebar-user-role { font-size: 11px; color: rgba(255,255,255,0.45); }
        .sidebar-logout-btn {
            width: 100%;
            display: flex; align-items: center; gap: 8px;
            padding: 9px 12px;
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px;
            background: transparent;
            color: #f87171; font-size: 13px; font-weight: 500;
            cursor: pointer; text-align: left;
            transition: all 0.2s;
        }
        .sidebar-logout-btn:hover { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.5); color: #ef4444; }
        .sidebar-link-home:hover { background: rgba(96,165,250,0.12); color: #60a5fa; }
    </style>

    <script>
        // Auto-highlight active sidebar link
        (function() {
            var path = window.location.pathname;
            var links = document.querySelectorAll('.sidebar-link');
            links.forEach(function(link) {
                var href = link.getAttribute('href');
                if (href && href !== '#' && href !== '/') {
                    if (path.startsWith(href)) {
                        link.classList.add('active');
                    }
                }
            });
        })();
    </script>
</aside>
</body>
</html>
