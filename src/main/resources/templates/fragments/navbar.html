<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="stayora-navbar">
    <div class="navbar-inner">
        <a href="/" class="navbar-logo">
            <span class="logo-icon">🏨</span>
            <span class="logo-text">HTD<span class="logo-accent">Hotel</span></span>
        </a>

        <div class="navbar-links">
            <a href="/" class="nav-link-item active" id="nav-home">Trang chủ</a>
            <a href="/rooms" class="nav-link-item" id="nav-rooms">Phòng</a>
            <a href="/offers" class="nav-link-item" id="nav-offers">Ưu đãi</a>
            <a href="/experience" class="nav-link-item" id="nav-experience">Trải nghiệm</a>
            <a href="/about" class="nav-link-item" id="nav-about">Về chúng tôi</a>
        </div>

        <div class="navbar-actions">
            <button class="nav-icon-btn" id="nav-search-btn" title="Tìm kiếm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </button>

            <div sec:authorize="!isAuthenticated()" class="nav-auth-btns">
                <a href="/login" class="btn-nav-login" id="nav-login">Đăng nhập</a>
                <a href="/register" class="btn-nav-register" id="nav-register">Đăng ký</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="nav-user-menu">
                <button class="nav-avatar-btn" id="userAvatarBtn" onclick="toggleUserMenu()">
                    <div class="avatar-circle">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
                    </div>
                </button>
                <div class="user-dropdown" id="userDropdownMenu">
                    <div class="dropdown-header">
                        <div class="dropdown-user-name" sec:authentication="principal.fullName">Người dùng</div>
                        <div class="dropdown-user-role">Tài khoản của bạn</div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a sec:authorize="hasRole('CUSTOMER')" href="/customer/bookings/history" class="dropdown-item-link" id="dd-bookings">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                        Lịch sử đặt phòng
                    </a>
                    <a sec:authorize="hasAnyRole('ADMIN', 'STAFF')" href="/admin/dashboard" class="dropdown-item-link" id="dd-admin">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        Trang Quản Trị
                    </a>
                    <div class="dropdown-divider"></div>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-logout-btn" id="dd-logout">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            Đăng xuất
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

        .stayora-navbar {
            background: #ffffff;
            border-bottom: 1px solid #e8eaf0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 1px 8px rgba(0,0,0,0.06);
        }
        .navbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            flex-shrink: 0;
        }
        .logo-icon { font-size: 22px; }
        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: #1a2332;
            letter-spacing: -0.5px;
        }
        .logo-accent { color: #2563eb; }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
        }
        .nav-link-item {
            text-decoration: none;
            color: #4b5563;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .nav-link-item:hover { color: #2563eb; background: #eff6ff; }
        .nav-link-item.active { color: #2563eb; font-weight: 600; }
        .navbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .nav-icon-btn {
            width: 36px; height: 36px;
            border: none; background: transparent;
            border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #4b5563; transition: all 0.2s;
        }
        .nav-icon-btn:hover { background: #f3f4f6; color: #1a2332; }
        .nav-auth-btns { display: flex; gap: 8px; }
        .btn-nav-login {
            text-decoration: none;
            color: #2563eb;
            font-size: 14px; font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1.5px solid #2563eb;
            transition: all 0.2s;
        }
        .btn-nav-login:hover { background: #eff6ff; }
        .btn-nav-register {
            text-decoration: none;
            color: #fff;
            font-size: 14px; font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            background: #2563eb;
            transition: all 0.2s;
        }
        .btn-nav-register:hover { background: #1d4ed8; }
        .nav-user-menu { position: relative; }
        .nav-avatar-btn {
            border: none; background: transparent; cursor: pointer;
            padding: 4px;
        }
        .avatar-circle {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
        }
        .user-dropdown {
            display: none;
            position: absolute; right: 0; top: calc(100% + 8px);
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            min-width: 220px;
            overflow: hidden;
            z-index: 9999;
        }
        .user-dropdown.show { display: block; }
        .dropdown-header { padding: 16px; background: #f8faff; }
        .dropdown-user-name { font-weight: 700; font-size: 14px; color: #1a2332; }
        .dropdown-user-role { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .dropdown-divider { height: 1px; background: #e5e7eb; }
        .dropdown-item-link {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            text-decoration: none; color: #374151;
            font-size: 14px; font-weight: 500;
            transition: background 0.15s;
        }
        .dropdown-item-link:hover { background: #f9fafb; color: #2563eb; }
        .dropdown-logout-btn {
            width: 100%;
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            border: none; background: transparent;
            color: #ef4444; font-size: 14px; font-weight: 500;
            cursor: pointer; text-align: left;
            transition: background 0.15s;
        }
        .dropdown-logout-btn:hover { background: #fef2f2; }
    </style>
    <script>
        function toggleUserMenu() {
            var menu = document.getElementById('userDropdownMenu');
            menu.classList.toggle('show');
        }
        document.addEventListener('click', function(e) {
            var btn = document.getElementById('userAvatarBtn');
            var menu = document.getElementById('userDropdownMenu');
            if (menu && btn && !btn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.remove('show');
            }
        });
    </script>
</nav>
</body>
</html>
