<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu — HTD Hotel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;background:#f5f7fa;}

        .auth-left{flex:1;background:linear-gradient(135deg,#0f1f3d 0%,#1e3a6e 50%,#2563eb 100%);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
        .auth-left-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=900&q=80') center/cover;opacity:.25;}
        .auth-left-content{position:relative;z-index:2;padding:48px;text-align:center;color:#fff;}
        .auth-brand{font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-bottom:16px;}
        .auth-brand span{color:#60a5fa;}
        .auth-tagline{font-size:18px;font-weight:600;margin-bottom:8px;line-height:1.3;}
        .auth-sub{font-size:14px;color:rgba(255,255,255,.65);line-height:1.6;}

        .auth-right{width:480px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:40px 48px;}
        .auth-form-wrap{width:100%;max-width:380px;}
        .form-logo{font-size:22px;font-weight:800;color:#1a2332;margin-bottom:8px;}
        .form-logo span{color:#2563eb;}
        .form-title{font-size:24px;font-weight:800;color:#1a2332;margin-bottom:4px;}
        .form-sub-text{font-size:14px;color:#6b7280;margin-bottom:32px;}

        .form-group{margin-bottom:18px;}
        .form-label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;}
        .form-control{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;color:#1a2332;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;font-family:'Inter',sans-serif;}
        .form-control:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1);}

        .btn-submit{width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;font-family:'Inter',sans-serif;}
        .btn-submit:hover{background:#1d4ed8;}

        .alert{padding:12px 14px;border-radius:10px;font-size:13.5px;font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
        .alert-danger{background:#fef2f2;color:#ef4444;border:1px solid #fecaca;}
        .alert-success{background:#dcfce7;color:#16a34a;border:1px solid #bbf7d0;}

        .back-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:#2563eb;text-decoration:none;font-weight:600;}
        .back-link:hover{text-decoration:underline;}

        @media(max-width:768px){
            .auth-left{display:none;}
            .auth-right{width:100%;padding:32px 24px;}
        }
    </style>
</head>
<body>
<div class="auth-left">
    <div class="auth-left-bg"></div>
    <div class="auth-left-content">
        <div class="auth-brand">🏨 HTD<span>Hotel</span></div>
        <div class="auth-tagline">Bạn quên mật khẩu?</div>
        <div class="auth-sub">Đừng lo lắng, chúng tôi sẽ giúp bạn lấy lại quyền truy cập ngay lập tức.</div>
    </div>
</div>

<div class="auth-right">
    <div class="auth-form-wrap">
        <div class="form-logo">🏨 HTD<span>Hotel</span></div>
        <h1 class="form-title">Lấy lại mật khẩu</h1>
        <p class="form-sub-text">Nhập email đã đăng ký của bạn. Hệ thống sẽ tự động cấp mật khẩu mới cho bạn.</p>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            <span th:text="${errorMessage}">Lỗi</span>
        </div>
        
        <div th:if="${successMessage}" class="alert alert-success">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            <span th:text="${successMessage}">Thành công</span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label class="form-label">Địa chỉ Email</label>
                <input type="email" name="email" class="form-control" required placeholder="example@email.com" id="inp-email-reset">
            </div>
            
            <button type="submit" class="btn-submit" id="btn-reset">Nhận mật khẩu mới</button>
        </form>

        <a th:href="@{/login}" class="back-link">← Quay lại Đăng nhập</a>
    </div>
</div>
</body>
</html>
