<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản — HTD Hotel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;background:#f5f7fa;}
        .auth-left{flex:1;background:linear-gradient(135deg,#0f1f3d 0%,#1e3a6e 50%,#2563eb 100%);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
        .auth-left-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=900&q=80') center/cover;opacity:.25;}
        .auth-left-content{position:relative;z-index:2;padding:48px;text-align:center;color:#fff;}
        .auth-brand{font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-bottom:16px;}
        .auth-brand span{color:#60a5fa;}
        .auth-tagline{font-size:18px;font-weight:600;margin-bottom:8px;}
        .auth-sub{font-size:14px;color:rgba(255,255,255,.65);line-height:1.6;}
        .auth-steps{margin-top:32px;display:flex;flex-direction:column;gap:16px;text-align:left;}
        .auth-step{display:flex;align-items:center;gap:12px;font-size:14px;color:rgba(255,255,255,.8);}
        .step-num{width:28px;height:28px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}

        .auth-right{width:520px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:40px 48px;overflow-y:auto;}
        .auth-form-wrap{width:100%;max-width:420px;}
        .form-logo{font-size:22px;font-weight:800;color:#1a2332;margin-bottom:8px;}
        .form-logo span{color:#2563eb;}
        .form-title{font-size:24px;font-weight:800;color:#1a2332;margin-bottom:4px;}
        .form-sub{font-size:14px;color:#6b7280;margin-bottom:28px;}
        .form-sub a{color:#2563eb;text-decoration:none;font-weight:600;}
        .form-sub a:hover{text-decoration:underline;}

        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
        .form-group{margin-bottom:16px;}
        .form-label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:7px;}
        .form-control{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;color:#1a2332;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;font-family:'Inter',sans-serif;}
        .form-control:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1);}
        .form-control.is-invalid{border-color:#ef4444;}
        .form-control::placeholder{color:#9ca3af;}
        .invalid-msg{font-size:12px;color:#ef4444;margin-top:5px;}

        .terms-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px;font-size:13px;color:#374151;line-height:1.5;}
        .terms-row input{accent-color:#2563eb;width:15px;height:15px;flex-shrink:0;margin-top:2px;}
        .terms-row a{color:#2563eb;text-decoration:none;font-weight:600;}
        .terms-row a:hover{text-decoration:underline;}

        .btn-submit{width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;font-family:'Inter',sans-serif;}
        .btn-submit:hover{background:#1d4ed8;}

        .alert{padding:12px 14px;border-radius:10px;font-size:13.5px;font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
        .alert-danger{background:#fef2f2;color:#ef4444;border:1px solid #fecaca;}

        .back-home{display:block;text-align:center;margin-top:16px;font-size:13px;color:#6b7280;text-decoration:none;}
        .back-home:hover{color:#2563eb;}

        @media(max-width:768px){
            .auth-left{display:none;}
            .auth-right{width:100%;padding:32px 24px;}
            .form-row{grid-template-columns:1fr;}
        }
    </style>
</head>
<body>
<div class="auth-left">
    <div class="auth-left-bg"></div>
    <div class="auth-left-content">
        <div class="auth-brand">🏨 HTD<span>Hotel</span></div>
        <div class="auth-tagline">Tham gia cộng đồng<br>du lịch thông minh</div>
        <div class="auth-sub">Đăng ký miễn phí và trải nghiệm hàng nghìn phòng cao cấp</div>
        <div class="auth-steps">
            <div class="auth-step"><div class="step-num">1</div>Tạo tài khoản miễn phí</div>
            <div class="auth-step"><div class="step-num">2</div>Tìm kiếm phòng phù hợp</div>
            <div class="auth-step"><div class="step-num">3</div>Đặt phòng & Tận hưởng</div>
        </div>
    </div>
</div>

<div class="auth-right">
    <div class="auth-form-wrap">
        <div class="form-logo">🏨 HTD<span>Hotel</span></div>
        <h1 class="form-title">Tạo tài khoản</h1>
        <p class="form-sub">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập tại đây</a></p>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" method="post" th:object="${registerRequest}">
            <div class="form-group">
                <label class="form-label">Họ và tên đầy đủ</label>
                <input type="text" class="form-control"
                       th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                       placeholder="Nguyễn Văn A" id="inp-fullname">
                <div class="invalid-msg" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Địa chỉ Email</label>
                    <input type="email" class="form-control"
                           th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="email@example.com" id="inp-email">
                    <div class="invalid-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" class="form-control"
                           th:field="*{phone}"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                           placeholder="0987654321" id="inp-phone">
                    <div class="invalid-msg" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control"
                           th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           placeholder="Ít nhất 6 ký tự" id="inp-password">
                    <div class="invalid-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" class="form-control"
                           th:field="*{confirmPassword}"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           placeholder="Nhập lại mật khẩu" id="inp-confirm-password">
                    <div class="invalid-msg" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
            </div>

            <label class="terms-row">
                <input type="checkbox" required id="agree-terms">
                Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a> và <a href="#">Chính sách bảo mật</a> của HTD Hotel.
            </label>

            <button type="submit" class="btn-submit" id="btn-register">Tạo tài khoản miễn phí</button>
        </form>

        <a href="/" class="back-home">← Quay lại trang chủ</a>
    </div>
</div>
</body>
</html>
