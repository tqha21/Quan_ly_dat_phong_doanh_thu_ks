<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý dịch vụ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <main class="p-5 w-100">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Quản lý dịch vụ đi kèm</h2>
            <a th:href="@{/admin/services/create}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Thêm dịch vụ</a>
        </div>
        <div th:if="${param.success}" class="alert alert-success">Lưu dịch vụ thành công.</div>
        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th class="ps-4">Mã</th><th>Tên dịch vụ</th><th>Mô tả</th><th>Đơn giá</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                    <tbody>
                    <tr th:each="service : ${services}">
                        <td class="ps-4 text-muted" th:text="${service.id}"></td>
                        <td class="fw-bold" th:text="${service.name}"></td>
                        <td th:text="${service.description}"></td>
                        <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(service.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></td>
                        <td><span class="badge" th:classappend="${service.status == 'ACTIVE' ? 'bg-success' : 'bg-secondary'}" th:text="${service.status == 'ACTIVE' ? 'Hoạt động' : 'Ngừng hoạt động'}"></span></td>
                        <td>
                            <a th:href="@{/admin/services/edit/{id}(id=${service.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                            <form class="d-inline" th:action="@{/admin/services/toggle/{id}(id=${service.id})}" method="post">
                                <button class="btn btn-sm btn-outline-secondary" type="submit" th:title="${service.status == 'ACTIVE' ? 'Ngừng hoạt động' : 'Kích hoạt'}"><i class="bi" th:classappend="${service.status == 'ACTIVE' ? 'bi-pause' : 'bi-play'}"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${services.empty}"><td colspan="6" class="text-center py-4 text-muted">Chưa có dịch vụ.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
