<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${service.id == null ? 'Thêm dịch vụ' : 'Sửa dịch vụ'}">Dịch vụ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <main class="p-5 w-100">
        <h2 class="fw-bold mb-4" th:text="${service.id == null ? 'Thêm dịch vụ đi kèm' : 'Cập nhật dịch vụ'}"></h2>
        <div class="card border-0 shadow-sm" style="max-width: 720px;">
            <div class="card-body p-4">
                <form th:action="@{/admin/services/save}" th:object="${service}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên dịch vụ</label>
                        <input class="form-control" th:field="*{name}" required maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mô tả</label>
                        <textarea class="form-control" th:field="*{description}" rows="3" maxlength="500"></textarea>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Đơn giá (VNĐ)</label>
                            <input type="number" min="0" step="0.01" class="form-control" th:field="*{price}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Trạng thái</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="ACTIVE">Hoạt động</option>
                                <option value="INACTIVE">Ngừng hoạt động</option>
                            </select>
                        </div>
                    </div>
                    <a th:href="@{/admin/services}" class="btn btn-outline-secondary me-2">Quay lại</a>
                    <button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i> Lưu dịch vụ</button>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
