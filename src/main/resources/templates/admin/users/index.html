<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' — HTD Hotel Admin'}">Người dùng — HTD Hotel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;background:#f5f7fa;color:#1a2332;display:flex;min-height:100vh;}
        .admin-wrapper{display:flex;width:100%;}
        .admin-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
        
        .admin-topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 32px;height:64px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
        .topbar-title{font-size:16px;font-weight:700;color:#1a2332;}
        .topbar-search{flex:1;max-width:360px;margin-left:24px;display:flex;align-items:center;gap:8px;background:#f5f7fa;border:1.5px solid #e5e7eb;border-radius:10px;padding:8px 14px;}
        .topbar-search input{border:none;outline:none;background:transparent;font-size:14px;color:#1a2332;width:100%;}
        .topbar-search input::placeholder{color:#9ca3af;}
        .topbar-search svg{color:#9ca3af;flex-shrink:0;}
        .topbar-avatar{margin-left:auto;width:38px;height:38px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;}

        .admin-main{flex:1;padding:32px;overflow-y:auto;}
        .page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;}
        .page-title{font-size:26px;font-weight:800;color:#1a2332;}
        .page-sub{font-size:14px;color:#6b7280;margin-top:4px;}

        .table-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
        .search-inline{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;padding:9px 14px;width:300px;}
        .search-inline input{border:none;outline:none;font-size:14px;color:#1a2332;background:transparent;width:100%;}
        .search-inline input::placeholder{color:#9ca3af;}

        .table-card{background:#fff;border-radius:14px;border:1px solid #e5e7eb;overflow:hidden;}
        table{width:100%;border-collapse:collapse;}
        thead{background:#f8faff;}
        th{padding:13px 16px;text-align:left;font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
        td{padding:13px 16px;border-bottom:1px solid #f0f0f0;font-size:14px;vertical-align:middle;color:#374151;}
        tr:last-child td{border-bottom:none;}
        tr:hover td{background:#fafbff;}

        .user-cell{display:flex;align-items:center;gap:12px;}
        .u-avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
        .u-name{font-weight:600;color:#1a2332;font-size:14.5px;}
        .u-id{font-size:12px;color:#9ca3af;margin-top:2px;font-weight:500;}
        .u-contact{display:flex;flex-direction:column;gap:2px;}
        .u-email{font-weight:500;color:#374151;}
        .u-phone{font-size:12px;color:#6b7280;}

        .role-badge{display:inline-flex;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;}
        .role-admin{background:#fef2f2;color:#ef4444;border:1px solid #fecaca;}
        .role-staff{background:#fff7ed;color:#ea580c;border:1px solid #fed7aa;}
        .role-customer{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;}

        .status-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;}
        .s-active{background:#dcfce7;color:#16a34a;}
        .s-inactive{background:#f3f4f6;color:#6b7280;}

        .action-btn{background:none;border:none;padding:6px;color:#9ca3af;cursor:pointer;border-radius:6px;transition:all .2s;}
        .action-btn:hover{background:#f5f7fa;color:#1a2332;}
    </style>
</head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    
    <div class="admin-content">
        <div class="admin-topbar">
            <span class="topbar-title">Cổng Quản trị</span>
            <div class="topbar-search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input type="text" placeholder="Tìm kiếm..." id="topbar-search">
            </div>
            <div class="topbar-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg></div>
        </div>

        <div class="admin-main">
            <div class="page-header">
                <div>
                    <h1 class="page-title" th:text="${pageTitle}"></h1>
                    <p class="page-sub" th:text="${pageSub}"></p>
                </div>
            </div>

            <div class="table-toolbar">
                <div class="search-inline">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" placeholder="Tìm tên, email, điện thoại..." oninput="filterUsers(this.value)">
                </div>
                <span style="font-size:13px;color:#6b7280;">Tổng <strong th:text="${users != null ? users.size() : 0}">0</strong> hồ sơ</span>
            </div>

            <div class="table-card">
                <table id="user-table">
                    <thead>
                        <tr>
                            <th>Hồ sơ</th>
                            <th>Liên hệ</th>
                            <th>Vai trò</th>
                            <th>Ngày tham gia</th>
                            <th>Trạng thái</th>
                            <th style="text-align:center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}" th:data-search="${u.fullName + ' ' + u.email + ' ' + u.phone}">
                            <td>
                                <div class="user-cell">
                                    <div class="u-avatar" style="background:linear-gradient(135deg,#2563eb,#7c3aed)" th:text="${u.fullName != null && !u.fullName.isEmpty() ? u.fullName.substring(0,1).toUpperCase() : 'U'}"></div>
                                    <div>
                                        <div class="u-name" th:text="${u.fullName}"></div>
                                        <div class="u-id" th:text="'#' + ${u.id}"></div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="u-contact">
                                    <div class="u-email" th:text="${u.email}"></div>
                                    <div class="u-phone" th:text="${u.phone}"></div>
                                </div>
                            </td>
                            <td>
                                <span th:if="${u.role.code == 'ROLE_ADMIN'}" class="role-badge role-admin">Quản trị viên</span>
                                <span th:if="${u.role.code == 'ROLE_STAFF'}" class="role-badge role-staff">Nhân viên</span>
                                <span th:if="${u.role.code == 'ROLE_CUSTOMER'}" class="role-badge role-customer">Khách hàng</span>
                            </td>
                            <td th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'dd/MM/yyyy') : 'N/A'}"></td>
                            <td>
                                <span th:if="${u.status == 'ACTIVE'}" class="status-badge s-active">Hoạt động</span>
                                <span th:if="${u.status != 'ACTIVE'}" class="status-badge s-inactive">Bị khóa</span>
                            </td>
                            <td style="text-align:center">
                                <button class="action-btn" title="Chi tiết"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                                <button class="action-btn" title="Chỉnh sửa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                            </td>
                        </tr>
                        <tr th:if="${users.empty}">
                            <td colspan="6" style="text-align:center;padding:48px;color:#9ca3af;">
                                <div style="font-size:32px;margin-bottom:12px;">👥</div>
                                <div style="font-weight:700;color:#374151;margin-bottom:4px;">Không tìm thấy dữ liệu</div>
                                <div style="font-size:13px;">Chưa có tài khoản nào được ghi nhận.</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
function filterUsers(q) {
    var rows = document.querySelectorAll('#user-table tbody tr[data-search]');
    rows.forEach(function(r) {
        var match = (r.dataset.search||'').toLowerCase().includes(q.toLowerCase());
        r.style.display = match ? '' : 'none';
    });
}
</script>
</body>
</html>
