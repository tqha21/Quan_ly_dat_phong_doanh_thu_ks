<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đánh giá — HTD Hotel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; color: #1a2332; display: flex; min-height: 100vh; }
        
        .admin-wrapper { display: flex; width: 100%; }
        .admin-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .admin-topbar {
            background: #fff; border-bottom: 1px solid #e5e7eb;
            padding: 0 32px; height: 64px;
            display: flex; align-items: center; gap: 16px;
            position: sticky; top: 0; z-index: 100;
        }
        .topbar-title { font-size: 16px; font-weight: 700; color: #1a2332; }
        
        .admin-main { flex: 1; padding: 32px; overflow-y: auto; }
        .page-header { margin-bottom: 28px; }
        .page-title { font-size: 26px; font-weight: 800; color: #1a2332; }
        
        .table-card {
            background: #fff; border-radius: 14px; border: 1px solid #e5e7eb;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #f8faff; }
        th { padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; font-size: 13.5px; }
        
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-delete:hover { background: #dc2626; }
    </style>
</head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <div class="admin-content">
        <div class="admin-topbar">
            <span class="topbar-title">Quản lý Đánh giá</span>
        </div>

        <div class="admin-main">
            <div class="page-header">
                <h1 class="page-title">Danh sách Đánh giá</h1>
            </div>

            <div th:if="${param.deleted}" class="alert alert-success" style="color:#16a34a; background:#dcfce7; padding:12px; border-radius:8px; margin-bottom:16px;">
                Đã xóa đánh giá thành công!
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Mã ĐG</th>
                            <th>Phòng</th>
                            <th>Khách hàng</th>
                            <th>Số sao</th>
                            <th>Nội dung</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${reviews}">
                            <td th:text="${r.id}"></td>
                            <td th:text="${r.room != null ? r.room.roomNumber : ''}"></td>
                            <td th:text="${r.customer != null ? r.customer.fullName : ''}"></td>
                            <td th:text="${r.rating + ' Sao'}"></td>
                            <td th:text="${r.comment}"></td>
                            <td>
                                <form th:action="@{/admin/reviews/delete}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa?');">
                                    <input type="hidden" name="id" th:value="${r.id}">
                                    <button type="submit" class="btn-delete">Xóa</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reviews)}">
                            <td colspan="6" style="text-align: center; padding: 20px;">Không có đánh giá nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
