<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Khuyến mãi — HTD Hotel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; color: #1a2332; display: flex; min-height: 100vh; }
        
        .admin-wrapper { display: flex; width: 100%; }
        .admin-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .admin-topbar {
            background: #fff; border-bottom: 1px solid #e5e7eb;
            padding: 0 32px; height: 64px;
            display: flex; align-items: center; gap: 16px;
            position: sticky; top: 0; z-index: 100;
        }
        .topbar-title { font-size: 16px; font-weight: 700; color: #1a2332; }
        
        .admin-main { flex: 1; padding: 32px; overflow-y: auto; }
        .page-header { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center;}
        .page-title { font-size: 26px; font-weight: 800; color: #1a2332; }
        
        .table-card {
            background: #fff; border-radius: 14px; border: 1px solid #e5e7eb;
            overflow: hidden; margin-bottom: 32px;
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #f8faff; }
        th { padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; font-size: 13.5px; }
        
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-delete:hover { background: #dc2626; }
        .btn-primary { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;}
        
        .form-card { background: #fff; border-radius: 14px; padding: 24px; border: 1px solid #e5e7eb; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: 'Inter'; }
    </style>
</head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <div class="admin-content">
        <div class="admin-topbar">
            <span class="topbar-title">Quản lý Khuyến mãi</span>
        </div>

        <div class="admin-main">
            <div class="page-header">
                <h1 class="page-title">Danh sách Khuyến mãi</h1>
            </div>

            <div th:if="${param.success}" class="alert alert-success" style="color:#16a34a; background:#dcfce7; padding:12px; border-radius:8px; margin-bottom:16px;">
                Lưu thành công!
            </div>
            <div th:if="${param.deleted}" class="alert alert-success" style="color:#16a34a; background:#dcfce7; padding:12px; border-radius:8px; margin-bottom:16px;">
                Đã xóa thành công!
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Mã CODE</th>
                            <th>Mô tả</th>
                            <th>Giảm (%)</th>
                            <th>Từ ngày</th>
                            <th>Đến ngày</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${promotions}">
                            <td style="font-weight:700; color:#2563eb;" th:text="${p.code}"></td>
                            <td th:text="${p.description}"></td>
                            <td th:text="${p.discountPercentage}"></td>
                            <td th:text="${p.startDate}"></td>
                            <td th:text="${p.endDate}"></td>
                            <td th:text="${p.status}"></td>
                            <td>
                                <form th:action="@{/admin/promotions/delete}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa?');">
                                    <input type="hidden" name="id" th:value="${p.id}">
                                    <button type="submit" class="btn-delete">Xóa</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(promotions)}">
                            <td colspan="7" style="text-align: center; padding: 20px;">Chưa có khuyến mãi nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="page-header">
                <h2 class="page-title" style="font-size:20px;">Thêm mới / Cập nhật</h2>
            </div>
            <div class="form-card">
                <form th:action="@{/admin/promotions/save}" method="post" th:object="${promotion}">
                    <div class="form-group">
                        <label class="form-label">Mã Code (vd: SUMMER20)</label>
                        <input type="text" class="form-control" th:field="*{code}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mô tả</label>
                        <input type="text" class="form-control" th:field="*{description}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phần trăm giảm (vd: 10.5)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{discountPercentage}" required>
                    </div>
                    <div style="display:flex; gap:16px;">
                        <div class="form-group" style="flex:1;">
                            <label class="form-label">Từ ngày</label>
                            <input type="date" class="form-control" th:field="*{startDate}" required>
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label class="form-label">Đến ngày</label>
                            <input type="date" class="form-control" th:field="*{endDate}" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Trạng thái</label>
                        <select class="form-control" th:field="*{status}">
                            <option value="ACTIVE">Hoạt động</option>
                            <option value="INACTIVE">Ngừng hoạt động</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Lưu thông tin</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
