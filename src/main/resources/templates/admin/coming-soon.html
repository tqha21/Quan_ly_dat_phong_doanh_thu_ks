<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính năng đang phát triển — HTD Hotel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;background:#f5f7fa;color:#1a2332;display:flex;min-height:100vh;}
        .admin-wrapper{display:flex;width:100%;}
        .admin-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
        
        .admin-topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 32px;height:64px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
        .topbar-title{font-size:16px;font-weight:700;color:#1a2332;}
        .topbar-avatar{margin-left:auto;width:38px;height:38px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;}

        .admin-main{flex:1;padding:32px;overflow-y:auto;display:flex;align-items:center;justify-content:center;}
        
        .coming-soon-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }
        .cs-icon {
            font-size: 64px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cs-title {
            font-size: 24px;
            font-weight: 800;
            color: #1a2332;
            margin-bottom: 12px;
        }
        .cs-desc {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .cs-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .cs-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    
    <div class="admin-content">
        <div class="admin-topbar">
            <span class="topbar-title">Cổng Quản trị</span>
            <div class="topbar-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg></div>
        </div>

        <div class="admin-main">
            <div class="coming-soon-card">
                <div class="cs-icon">🚧</div>
                <h1 class="cs-title">Tính năng đang phát triển</h1>
                <p class="cs-desc">Chúng tôi đang làm việc chăm chỉ để hoàn thiện module này. Hãy quay lại sau nhé, bản cập nhật mới nhất sẽ sớm được ra mắt!</p>
                <a href="/admin/dashboard" class="cs-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Quay về Tổng quan
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
