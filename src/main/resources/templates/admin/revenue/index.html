<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doanh thu & Báo cáo — HTD Hotel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f5f7fa; color: #1a2332; display: flex; min-height: 100vh; }
        
        .admin-wrapper { display: flex; width: 100%; }
        .admin-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .admin-topbar {
            background: #fff; border-bottom: 1px solid #e5e7eb;
            padding: 0 32px; height: 64px;
            display: flex; align-items: center; gap: 16px;
            position: sticky; top: 0; z-index: 100;
        }
        .topbar-title { font-size: 16px; font-weight: 700; color: #1a2332; }
        
        .admin-main { flex: 1; padding: 32px; overflow-y: auto; }
        .page-header { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center;}
        .page-title { font-size: 26px; font-weight: 800; color: #1a2332; }
        
        .btn-export {
            display: flex; align-items: center; gap: 6px;
            background: #16a34a; color: #fff; text-decoration: none;
            border: none; border-radius: 10px;
            padding: 10px 20px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-export:hover { background: #15803d; }

        .stat-card {
            background: #fff; border-radius: 14px; padding: 22px;
            border: 1px solid #e5e7eb; margin-bottom: 32px;
            display: inline-block; min-width: 250px;
        }
        .stat-label { font-size: 12px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .stat-value { font-size: 26px; font-weight: 800; color: #2563eb; line-height: 1; }

        .table-card {
            background: #fff; border-radius: 14px; border: 1px solid #e5e7eb;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #f8faff; }
        th { padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; font-size: 13.5px; }
        
    </style>
</head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <div class="admin-content">
        <div class="admin-topbar">
            <span class="topbar-title">Doanh thu & Báo cáo</span>
        </div>

        <div class="admin-main">
            <div class="page-header">
                <h1 class="page-title">Báo cáo Doanh thu</h1>
                <a href="/admin/revenue/export-csv" class="btn-export">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Xuất CSV
                </a>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">Doanh thu tháng này</div>
                <div class="stat-value" th:text="${#numbers.formatDecimal(monthlyRevenue, 0, 'COMMA', 0, 'POINT') + '₫'}">0₫</div>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Mã Thanh Toán</th>
                            <th>Mã Đặt Phòng</th>
                            <th>Số Tiền</th>
                            <th>Phương Thức</th>
                            <th>Ngày Thanh Toán</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${payments}">
                            <td style="font-weight:700; color:#2563eb;" th:text="${p.id}"></td>
                            <td th:text="${p.booking != null ? p.booking.bookingCode : ''}"></td>
                            <td th:text="${#numbers.formatDecimal(p.amount, 0, 'COMMA', 0, 'POINT') + '₫'}"></td>
                            <td th:text="${p.paymentMethod}"></td>
                            <td th:text="${#temporals.format(p.paidAt, 'dd/MM/yyyy HH:mm')}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(payments)}">
                            <td colspan="5" style="text-align: center; padding: 20px;">Không có dữ liệu thanh toán.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
