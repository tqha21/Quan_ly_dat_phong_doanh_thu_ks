<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đặt phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table th { background-color: #667eea; color: #fff; font-weight: 500; }
        .badge-pending { background-color: #ffc107; color: #000; }
        .badge-confirmed { background-color: #0dcaf0; color: #fff; }
        .badge-checked-in { background-color: #198754; color: #fff; }
        .badge-checked-out { background-color: #6c757d; color: #fff; }
        .badge-cancelled { background-color: #dc3545; color: #fff; }
        .btn-action { padding: 0.25rem 0.5rem; font-size: 0.875rem; border-radius: 6px; margin: 0 2px;}
    </style>
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    
    <div class="container-fluid py-5">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bold" style="color: #667eea;"><i class="fas fa-calendar-alt me-2"></i>Quản lý Đặt phòng</h2>
                <p class="text-muted">Xem và quản lý tất cả các đơn đặt phòng của khách sạn</p>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Mã đơn</th>
                                <th>Khách hàng</th>
                                <th>SĐT</th>
                                <th>Phòng</th>
                                <th>Ngày nhận - trả</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="booking : ${bookings}">
                                <td class="fw-bold" th:text="${booking.bookingCode}"></td>
                                <td th:text="${booking.customerName}"></td>
                                <td th:text="${booking.customerPhone}"></td>
                                <td>
                                    <span th:text="${booking.roomNumber}"></span><br>
                                    <small class="text-muted" th:text="${booking.roomTypeName}"></small>
                                </td>
                                <td>
                                    <span th:text="${#temporals.format(booking.checkInDate, 'dd/MM/yyyy')}"></span><br>
                                    <span class="text-muted">đến</span>
                                    <span th:text="${#temporals.format(booking.checkOutDate, 'dd/MM/yyyy')}"></span>
                                </td>
                                <td class="fw-bold" th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                <td>
                                    <span class="badge badge-pending" th:if="${booking.status == 'PENDING'}">Chờ XN</span>
                                    <span class="badge badge-confirmed" th:if="${booking.status == 'CONFIRMED'}">Đã XN</span>
                                    <span class="badge badge-checked-in" th:if="${booking.status == 'CHECKED_IN'}">Nhận phòng</span>
                                    <span class="badge badge-checked-out" th:if="${booking.status == 'CHECKED_OUT'}">Trả phòng</span>
                                    <span class="badge badge-cancelled" th:if="${booking.status == 'CANCELLED'}">Đã Hủy</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/bookings/{id}/update-status(id=${booking.id})}" method="post" class="d-inline">
                                        <div class="input-group input-group-sm">
                                            <select name="status" class="form-select form-select-sm" style="max-width: 130px;">
                                                <option value="PENDING" th:selected="${booking.status == 'PENDING'}">Chờ XN</option>
                                                <option value="CONFIRMED" th:selected="${booking.status == 'CONFIRMED'}">Đã XN</option>
                                                <option value="CHECKED_IN" th:selected="${booking.status == 'CHECKED_IN'}">Nhận phòng</option>
                                                <option value="CHECKED_OUT" th:selected="${booking.status == 'CHECKED_OUT'}">Trả phòng</option>
                                                <option value="CANCELLED" th:selected="${booking.status == 'CANCELLED'}">Hủy</option>
                                            </select>
                                            <button type="submit" class="btn btn-outline-primary btn-sm"><i class="fas fa-save"></i></button>
                                        </div>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(bookings)}">
                                <td colspan="8" class="text-center py-4 text-muted">Không có đơn đặt phòng nào.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
