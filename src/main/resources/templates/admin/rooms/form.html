<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${roomDTO.id == null ? 'Thêm phòng mới' : 'Cập nhật phòng'} + ' — HTD Hotel Admin'">Form phòng</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;background:#f5f7fa;color:#1a2332;display:flex;min-height:100vh;}
        .admin-wrapper{display:flex;width:100%;}
        .admin-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
        .admin-topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 32px;height:64px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
        .topbar-title{font-size:16px;font-weight:700;color:#1a2332;}
        .topbar-avatar{width:38px;height:38px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;margin-left:auto;}

        .admin-main{flex:1;padding:32px;overflow-y:auto;}
        .breadcrumb-row{display:flex;align-items:center;gap:8px;margin-bottom:24px;}
        .breadcrumb-row a{color:#2563eb;text-decoration:none;font-size:13px;font-weight:500;}
        .breadcrumb-row a:hover{text-decoration:underline;}
        .breadcrumb-sep{color:#d1d5db;font-size:14px;}
        .breadcrumb-current{font-size:13px;color:#6b7280;}

        .page-title{font-size:26px;font-weight:800;color:#1a2332;margin-bottom:4px;}
        .page-sub{font-size:14px;color:#6b7280;margin-bottom:32px;}

        .form-layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;}

        .form-card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;padding:32px;}
        .form-card-title{font-size:16px;font-weight:700;color:#1a2332;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #f0f0f0;}

        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
        .form-group{margin-bottom:20px;}
        .form-group:last-child{margin-bottom:0;}
        .form-label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;}
        .form-label .required{color:#ef4444;}
        .form-control{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;color:#1a2332;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;font-family:'Inter',sans-serif;}
        .form-control:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1);}
        .form-control.is-invalid{border-color:#ef4444;}
        .form-control::placeholder{color:#9ca3af;}
        select.form-control{cursor:pointer;}
        textarea.form-control{resize:vertical;min-height:100px;}
        .invalid-msg{font-size:12px;color:#ef4444;margin-top:6px;}

        .side-card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;padding:24px;margin-bottom:20px;}
        .side-card-title{font-size:14px;font-weight:700;color:#1a2332;margin-bottom:16px;}

        .status-option{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1.5px solid #e5e7eb;margin-bottom:10px;cursor:pointer;transition:all .2s;}
        .status-option:hover{border-color:#2563eb;background:#f8faff;}
        .status-option input[type="radio"]{accent-color:#2563eb;width:16px;height:16px;}
        .status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
        .dot-green{background:#16a34a;}
        .dot-orange{background:#ea580c;}
        .dot-red{background:#ef4444;}
        .dot-gray{background:#9ca3af;}
        .status-option-label{font-size:13.5px;font-weight:600;color:#374151;}

        .form-actions{display:flex;gap:12px;justify-content:flex-end;padding-top:24px;border-top:1px solid #f0f0f0;margin-top:8px;}
        .btn-cancel{padding:11px 22px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;font-weight:600;color:#374151;background:#fff;text-decoration:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
        .btn-cancel:hover{border-color:#374151;background:#f5f7fa;}
        .btn-save{padding:11px 28px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s;display:inline-flex;align-items:center;gap:8px;}
        .btn-save:hover{background:#1d4ed8;}

        .alert{padding:12px 16px;border-radius:10px;font-size:14px;font-weight:500;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
        .alert-danger{background:#fef2f2;color:#ef4444;border:1px solid #fecaca;}

        @media(max-width:900px){.form-layout{grid-template-columns:1fr;}.form-row{grid-template-columns:1fr;}}
    </style>
</head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <span class="topbar-title">Cổng Quản trị</span>
            <div class="topbar-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg></div>
        </div>

        <div class="admin-main">
            <!-- BREADCRUMB -->
            <div class="breadcrumb-row">
                <a href="/admin/dashboard">Tổng quan</a>
                <span class="breadcrumb-sep">›</span>
                <a href="/admin/rooms">Quản lý Phòng</a>
                <span class="breadcrumb-sep">›</span>
                <span class="breadcrumb-current" th:text="${roomDTO.id == null ? 'Thêm mới' : 'Chỉnh sửa #' + roomDTO.roomNumber}">Form</span>
            </div>

            <h1 class="page-title" th:text="${roomDTO.id == null ? 'Thêm phòng mới' : 'Cập nhật phòng'}">Form phòng</h1>
            <p class="page-sub" th:text="${roomDTO.id == null ? 'Điền thông tin để tạo phòng mới trong hệ thống.' : 'Chỉnh sửa thông tin phòng hiện có.'}"></p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/admin/rooms/save}" method="post" th:object="${roomDTO}">
                <input type="hidden" th:field="*{id}">
                <div class="form-layout">
                    <!-- MAIN FORM -->
                    <div class="form-card">
                        <div class="form-card-title">Thông tin phòng</div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Số phòng <span class="required">*</span></label>
                                <input type="text" class="form-control" th:field="*{roomNumber}"
                                       th:classappend="${#fields.hasErrors('roomNumber')} ? 'is-invalid'"
                                       placeholder="Vd: 101" id="inp-room-number">
                                <div class="invalid-msg" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Loại phòng <span class="required">*</span></label>
                                <select class="form-control" th:field="*{roomTypeId}"
                                        th:classappend="${#fields.hasErrors('roomTypeId')} ? 'is-invalid'" id="inp-room-type">
                                    <option value="">-- Chọn loại phòng --</option>
                                    <option th:each="rt : ${roomTypes}"
                                            th:value="${rt.id}"
                                            th:text="${rt.name + ' — ' + #numbers.formatDecimal(rt.price, 0, 'COMMA', 0, 'POINT') + '₫'}"></option>
                                </select>
                                <div class="invalid-msg" th:if="${#fields.hasErrors('roomTypeId')}" th:errors="*{roomTypeId}"></div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Tầng <span class="required">*</span></label>
                                <input type="number" class="form-control" th:field="*{floor}"
                                       th:classappend="${#fields.hasErrors('floor')} ? 'is-invalid'"
                                       placeholder="Vd: 1" min="1" id="inp-floor">
                                <div class="invalid-msg" th:if="${#fields.hasErrors('floor')}" th:errors="*{floor}"></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Sức chứa (người)</label>
                                <input type="number" class="form-control" placeholder="Vd: 2" min="1" id="inp-capacity">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Mô tả phòng</label>
                            <textarea class="form-control" th:field="*{description}" rows="4"
                                      placeholder="Mô tả chi tiết về phòng..." id="inp-desc"></textarea>
                        </div>

                        <div class="form-actions">
                            <a th:href="@{/admin/rooms}" class="btn-cancel" id="btn-cancel-form">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                Hủy bỏ
                            </a>
                            <button type="submit" class="btn-save" id="btn-save-form">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                                <span th:text="${roomDTO.id == null ? 'Tạo phòng' : 'Lưu thay đổi'}">Lưu</span>
                            </button>
                        </div>
                    </div>

                    <!-- SIDE PANEL -->
                    <div>
                        <div class="side-card">
                            <div class="side-card-title">Trạng thái phòng</div>
                            <label class="status-option">
                                <input type="radio" name="status" th:field="*{status}" value="AVAILABLE">
                                <span class="status-dot dot-green"></span>
                                <span class="status-option-label">Phòng trống</span>
                            </label>
                            <label class="status-option">
                                <input type="radio" name="status" th:field="*{status}" value="OCCUPIED">
                                <span class="status-dot dot-orange"></span>
                                <span class="status-option-label">Đang có khách</span>
                            </label>
                            <label class="status-option">
                                <input type="radio" name="status" th:field="*{status}" value="MAINTENANCE">
                                <span class="status-dot dot-red"></span>
                                <span class="status-option-label">Bảo trì</span>
                            </label>
                            <label class="status-option">
                                <input type="radio" name="status" th:field="*{status}" value="INACTIVE">
                                <span class="status-dot dot-gray"></span>
                                <span class="status-option-label">Ngừng hoạt động</span>
                            </label>
                        </div>

                        <div class="side-card">
                            <div class="side-card-title">Hướng dẫn</div>
                            <p style="font-size:13px;color:#6b7280;line-height:1.6;">
                                • Số phòng phải là duy nhất trong hệ thống.<br>
                                • Loại phòng xác định giá cơ bản.<br>
                                • Trạng thái <strong>Ngừng HĐ</strong> sẽ ẩn phòng khỏi danh sách đặt phòng.
                            </p>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
