<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Inter', sans-serif; }
        .wrapper { display: flex; }
        .content { padding: 40px; width: 100%; }
        .custom-card { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: none; }
    </style>
</head>
<body>
<div class="wrapper">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    
    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">Danh sách Phòng (Rooms)</h2>
            <a th:href="@{/admin/rooms/create}" class="btn btn-primary fw-bold shadow-sm" style="background-color: #667eea; border: none;">
                <i class="bi bi-plus-circle me-1"></i> Thêm Phòng Mới
            </a>
        </div>
        
        <div th:if="${param.success}" class="alert alert-success shadow-sm rounded-3"><i class="bi bi-check-circle-fill me-2"></i> Lưu dữ liệu thành công!</div>
        <div th:if="${param.deleted}" class="alert alert-warning shadow-sm rounded-3"><i class="bi bi-exclamation-triangle-fill me-2"></i> Đã vô hiệu hóa phòng!</div>
        <div th:if="${errorMessage}" class="alert alert-danger shadow-sm rounded-3" th:text="${errorMessage}"></div>

        <div class="card custom-card">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Số phòng</th>
                            <th>Tầng</th>
                            <th>Loại phòng</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${rooms}">
                            <td class="ps-4 fw-bold text-dark" th:text="${r.roomNumber}"></td>
                            <td th:text="${'Tầng ' + r.floor}"></td>
                            <td class="text-primary fw-semibold" th:text="${r.roomTypeName}"></td>
                            <td>
                                <span th:if="${r.status == 'AVAILABLE'}" class="badge bg-success rounded-pill px-3 py-2">Trống (Sẵn sàng)</span>
                                <span th:if="${r.status == 'OCCUPIED'}" class="badge bg-warning text-dark rounded-pill px-3 py-2">Đang có khách</span>
                                <span th:if="${r.status == 'MAINTENANCE'}" class="badge bg-danger rounded-pill px-3 py-2">Bảo trì</span>
                                <span th:if="${r.status == 'INACTIVE'}" class="badge bg-secondary rounded-pill px-3 py-2">Ngừng HĐ</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/admin/rooms/edit/{id}(id=${r.id})}" class="btn btn-sm btn-outline-primary shadow-sm"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{/admin/rooms/delete/{id}(id=${r.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn vô hiệu hóa phòng này?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger shadow-sm" th:disabled="${r.status == 'INACTIVE' || r.status == 'OCCUPIED'}"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${rooms.empty}">
                            <td colspan="5" class="text-center py-4 text-muted">Chưa có dữ liệu phòng.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
