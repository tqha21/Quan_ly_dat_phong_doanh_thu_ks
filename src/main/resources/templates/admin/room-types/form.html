<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật Loại phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Inter', sans-serif; }
        .wrapper { display: flex; }
        .content { padding: 40px; width: 100%; }
        .custom-card { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: none; }
    </style>
</head>
<body>
<div class="wrapper">
    <!-- Include Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    
    <div class="content">
        <div class="mb-4">
            <a th:href="@{/admin/room-types}" class="btn btn-outline-secondary btn-sm mb-3 shadow-sm fw-bold"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
            <h2 class="fw-bold text-dark" th:text="${roomTypeDTO.id == null ? 'Thêm Loại Phòng Mới' : 'Cập Nhật Loại Phòng'}"></h2>
        </div>

        <div class="card custom-card" style="max-width: 800px;">
            <div class="card-body p-4 p-md-5">
                <form th:action="@{/admin/room-types/save}" method="post" th:object="${roomTypeDTO}">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-muted">Tên loại phòng <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="Vd: Superior Double">
                            <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-muted">Giá mỗi đêm (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" step="1000" class="form-control form-control-lg" th:field="*{price}" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" placeholder="Vd: 500000">
                            <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted">Sức chứa (người) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" th:field="*{capacity}" th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback fw-bold" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted">Diện tích (m2)</label>
                            <input type="number" step="0.1" class="form-control" th:field="*{area}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted">Trạng thái</label>
                            <select class="form-select text-dark" th:field="*{status}">
                                <option value="ACTIVE">Hoạt động</option>
                                <option value="INACTIVE">Ngừng hoạt động</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="form-label fw-bold text-muted">Mô tả chi tiết</label>
                        <textarea class="form-control" th:field="*{description}" rows="5" placeholder="Nhập thông tin giới thiệu loại phòng..."></textarea>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold px-5 shadow-sm" style="background-color: #667eea; border: none;">
                            <i class="bi bi-save me-1"></i> LƯU DỮ LIỆU
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
