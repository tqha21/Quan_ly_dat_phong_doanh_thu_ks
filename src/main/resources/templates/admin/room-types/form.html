<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật Loại phòng — HTD Hotel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;background:#f5f7fa;color:#1a2332;display:flex;min-height:100vh;}
        .admin-wrapper{display:flex;width:100%;}
        .admin-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
        
        .admin-topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 32px;height:64px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
        .topbar-title{font-size:16px;font-weight:700;color:#1a2332;}
        .topbar-avatar{margin-left:auto;width:38px;height:38px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;}

        .admin-main{flex:1;padding:32px;overflow-y:auto;}
        
        .btn-back{display:inline-flex;align-items:center;gap:6px;color:#6b7280;font-size:14px;font-weight:600;text-decoration:none;margin-bottom:20px;transition:color .2s;}
        .btn-back:hover{color:#2563eb;}
        
        .page-header{margin-bottom:28px;}
        .page-title{font-size:26px;font-weight:800;color:#1a2332;}
        
        .form-card{background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:32px;max-width:800px;}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
        .form-row.cols-3{grid-template-columns:1fr 1fr 1fr;}
        
        .form-group{display:flex;flex-direction:column;gap:8px;}
        .form-label{font-size:13px;font-weight:600;color:#374151;}
        .form-label .req{color:#ef4444;}
        .form-control, .form-select{width:100%;padding:10px 14px;background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;color:#1a2332;outline:none;transition:all .2s;font-family:inherit;}
        .form-control:focus, .form-select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.1);}
        .form-control::placeholder{color:#9ca3af;}
        textarea.form-control{resize:vertical;min-height:100px;}
        
        .is-invalid{border-color:#ef4444;}
        .invalid-feedback{font-size:12px;color:#ef4444;margin-top:-4px;}
        
        .form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid #e5e7eb;}
        .btn-cancel{padding:10px 20px;border:1.5px solid #e5e7eb;background:#fff;color:#374151;font-size:14px;font-weight:600;border-radius:10px;text-decoration:none;transition:all .2s;}
        .btn-cancel:hover{background:#f9fafb;border-color:#d1d5db;}
        .btn-save{padding:10px 24px;border:none;background:#2563eb;color:#fff;font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;transition:background .2s;}
        .btn-save:hover{background:#1d4ed8;}
    </style>
</head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    
    <div class="admin-content">
        <div class="admin-topbar">
            <span class="topbar-title">Cổng Quản trị</span>
            <div class="topbar-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg></div>
        </div>

        <div class="admin-main">
            <a th:href="@{/admin/room-types}" class="btn-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Quay lại danh sách
            </a>
            
            <div class="page-header">
                <h1 class="page-title" th:text="${roomTypeDTO.id == null ? 'Thêm Loại Phòng Mới' : 'Cập Nhật Loại Phòng'}"></h1>
            </div>

            <div class="form-card">
                <form th:action="@{/admin/room-types/save}" method="post" th:object="${roomTypeDTO}">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Tên loại phòng <span class="req">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="Vd: Superior Double, Deluxe King">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Giá mỗi đêm (VNĐ) <span class="req">*</span></label>
                            <input type="number" step="1000" class="form-control" th:field="*{price}" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" placeholder="Ví dụ: 1500000">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>
                    </div>
                    
                    <div class="form-row cols-3">
                        <div class="form-group">
                            <label class="form-label">Sức chứa <span class="req">*</span></label>
                            <input type="number" class="form-control" th:field="*{capacity}" th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid'" placeholder="Số người tối đa">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Diện tích (m²)</label>
                            <input type="number" step="0.1" class="form-control" th:field="*{area}" placeholder="Vd: 35.5">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Trạng thái</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="ACTIVE">Hoạt động</option>
                                <option value="INACTIVE">Ngừng HĐ</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label">Mô tả chi tiết</label>
                        <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Nhập thông tin giới thiệu, các tiện nghi đi kèm của hạng phòng này..."></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <a th:href="@{/admin/room-types}" class="btn-cancel">Hủy bỏ</a>
                        <button type="submit" class="btn-save">Lưu dữ liệu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
