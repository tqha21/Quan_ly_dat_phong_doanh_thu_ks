<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Loại phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Inter', sans-serif; }
        .wrapper { display: flex; }
        .content { padding: 40px; width: 100%; }
        .custom-card { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: none; }
    </style>
</head>
<body>
<div class="wrapper">
    <!-- Include Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    
    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">Danh sách Loại Phòng</h2>
            <a th:href="@{/admin/room-types/create}" class="btn btn-primary fw-bold shadow-sm" style="background-color: #667eea; border: none;">
                <i class="bi bi-plus-circle me-1"></i> Thêm Mới
            </a>
        </div>
        
        <div th:if="${param.success}" class="alert alert-success shadow-sm rounded-3"><i class="bi bi-check-circle-fill me-2"></i> Lưu dữ liệu thành công!</div>
        <div th:if="${param.deleted}" class="alert alert-warning shadow-sm rounded-3"><i class="bi bi-exclamation-triangle-fill me-2"></i> Đã chuyển loại phòng sang trạng thái Ngừng Hoạt Động!</div>

        <div class="card custom-card">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Mã</th>
                            <th>Tên loại phòng</th>
                            <th>Sức chứa</th>
                            <th>Giá (VNĐ)</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rt : ${roomTypes}">
                            <td class="ps-4 text-muted" th:text="${rt.id}"></td>
                            <td class="fw-bold text-dark" th:text="${rt.name}"></td>
                            <td th:text="${rt.capacity + ' người'}"></td>
                            <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(rt.price, 0, 'COMMA', 0, 'POINT')}"></td>
                            <td>
                                <span th:if="${rt.status == 'ACTIVE'}" class="badge bg-success rounded-pill px-3 py-2">Hoạt động</span>
                                <span th:if="${rt.status == 'INACTIVE'}" class="badge bg-secondary rounded-pill px-3 py-2">Ngừng HĐ</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/admin/room-types/edit/{id}(id=${rt.id})}" class="btn btn-sm btn-outline-primary shadow-sm"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{/admin/room-types/delete/{id}(id=${rt.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn vô hiệu hóa loại phòng này?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger shadow-sm" th:disabled="${rt.status == 'INACTIVE'}"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${roomTypes.empty}">
                            <td colspan="6" class="text-center py-4 text-muted">Chưa có dữ liệu loại phòng.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
