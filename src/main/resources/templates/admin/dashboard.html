<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6fb; font-family: 'Inter', sans-serif; }
        .dashboard-header { color: #667eea; margin-bottom: 2rem; font-weight: 700; }
        .stat-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .stat-card .card-body {
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        .stat-icon {
            font-size: 3rem;
            position: absolute;
            right: 1.5rem;
            bottom: 1.5rem;
            opacity: 0.2;
            z-index: 0;
            transition: transform 0.3s ease;
        }
        .stat-card:hover .stat-icon {
            transform: scale(1.1);
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .stat-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .card-revenue { border-left: 5px solid #28a745; }
        .card-revenue .stat-value { color: #28a745; }
        
        .card-pending { border-left: 5px solid #ffc107; }
        .card-pending .stat-value { color: #ffc107; }
        
        .card-rooms { border-left: 5px solid #667eea; }
        .card-rooms .stat-value { color: #667eea; }
        
        .card-checked-in { border-left: 5px solid #17a2b8; }
        .card-checked-in .stat-value { color: #17a2b8; }
    </style>
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    
    <div class="container py-5">
        <h2 class="dashboard-header"><i class="fas fa-chart-pie me-2"></i>Tổng quan hệ thống</h2>
        
        <div class="row g-4">
            <!-- Doanh thu tháng này -->
            <div class="col-md-6 col-lg-3">
                <div class="card stat-card card-revenue h-100">
                    <div class="card-body">
                        <div class="stat-title">Doanh thu tháng</div>
                        <div class="stat-value" th:text="${#numbers.formatDecimal(monthlyRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>
                        <i class="fas fa-money-bill-wave stat-icon text-success"></i>
                    </div>
                </div>
            </div>
            
            <!-- Đơn chờ xác nhận -->
            <div class="col-md-6 col-lg-3">
                <div class="card stat-card card-pending h-100">
                    <div class="card-body">
                        <div class="stat-title">Đơn chờ XN</div>
                        <div class="stat-value" th:text="${pendingBookings}">0</div>
                        <i class="fas fa-clock stat-icon text-warning"></i>
                    </div>
                </div>
            </div>
            
            <!-- Tổng số phòng -->
            <div class="col-md-6 col-lg-3">
                <div class="card stat-card card-rooms h-100">
                    <div class="card-body">
                        <div class="stat-title">Tổng số phòng</div>
                        <div class="stat-value" th:text="${totalRooms}">0</div>
                        <i class="fas fa-door-open stat-icon text-primary"></i>
                    </div>
                </div>
            </div>
            
            <!-- Khách đang ở -->
            <div class="col-md-6 col-lg-3">
                <div class="card stat-card card-checked-in h-100">
                    <div class="card-body">
                        <div class="stat-title">Khách đang ở</div>
                        <div class="stat-value" th:text="${checkedInBookings}">0</div>
                        <i class="fas fa-bed stat-icon text-info"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
