<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Từ chối truy cập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background:#004d40; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
        .error-box { text-align:center; color:#fff; }
        .error-code { font-size:120px; font-weight:900; line-height:1; margin-bottom:8px; }
        .error-msg { font-size:20px; margin-bottom:32px; opacity:.85; }
        .btn-home { background:#fff; color:#004d40; font-weight:700; padding:12px 32px; border-radius:4px; text-decoration:none; font-size:16px; transition:all .2s; display:inline-block; }
        .btn-home:hover { background:#e0f2f1; color:#004d40; transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.2); }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">403</div>
        <p class="error-msg">Bạn không có quyền truy cập trang này</p>
        <a th:href="@{/}" class="btn-home"><i class="bi bi-house-door me-1"></i> Quay lại trang chủ</a>
    </div>
</body>
</html>
